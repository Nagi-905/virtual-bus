[package]
name = "marlin-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "virtual-bus demo: load the rtl-demo Verilog with Marlin instead of virtual-bus-build, and dump waveforms"
license = "MIT"
publish = false

[dependencies]
virtual-bus = { path = "../../virtual-bus" }
embedded-hal = "1.0"
marlin = { version = "0.21.1", features = ["verilog"] }

[dev-dependencies]
embedded-hal-bus = { version = "0.3", features = ["std"] }
# the virtual-bus-build models of the same RTL, to compare against
rtl-demo = { path = "../rtl-demo" }
