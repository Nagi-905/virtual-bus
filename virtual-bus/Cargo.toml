[package]
name = "virtual-bus"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Test embedded Rust drivers without hardware — from register maps to RTL simulation. Virtual I2C / SPI buses for embedded-hal 1.0"
license = "MIT"
repository = "https://github.com/Nagi-905/virtual-bus"
keywords = ["embedded-hal", "i2c", "spi", "simulation", "verilator"]
categories = ["embedded", "simulation", "development-tools::testing"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"

[dev-dependencies]
embedded-hal-bus = { version = "0.3", features = ["std", "async"] }
mcp23017-driver = "0.1.2"
lis3dh-async = "0.9.3"
embassy-futures = "0.1"

[[example]]
name = "mcp23017"
path = "examples/mcp23017/main.rs"
